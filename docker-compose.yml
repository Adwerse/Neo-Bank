# Shared by every Go service (gateway included): where to ship spans, and
# the service-name/sampling knobs pkg/tracing reads. Defined once as a
# merge anchor rather than repeated seven times — the endpoint is the kind
# of value that drifts when it lives in seven places.
#
# service.name is NOT set here: each service passes its own real name to
# tracing.Init, because a Jaeger dependency diagram where four services
# all call themselves "app" is worse than no diagram.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      <<: *otel-env
      JWT_SECRET: neobank_dev_jwt_secret_change_me
      KAFKA_BROKERS: kafka:9092
    depends_on:
      auth-svc:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  auth-svc:
    build:
      context: .
      dockerfile: services/auth-svc/Dockerfile
    ports:
      - "8081:8081"
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://neobank:neobank_dev_password@pg-haproxy:5432/neobank?sslmode=disable
      SMTP_ADDR: mailpit:1025
      SMTP_FROM: noreply@neobank.local
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: user.events
      JWT_SECRET: neobank_dev_jwt_secret_change_me
    depends_on:
      pg-haproxy:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      redis:
        condition: service_healthy

  accounts-svc:
    build:
      context: .
      dockerfile: services/accounts-svc/Dockerfile
    ports:
      - "8082:8082"
      - "9082:9082"
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://neobank:neobank_dev_password@pg-haproxy:5432/neobank?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: user.events
      KAFKA_ACCOUNT_EVENTS_TOPIC: account.events
      LEDGER_GRPC_ADDR: ledger-svc:8083
      GRPC_PORT: "9082"
      # A fictitious 4-letter institution code, not a real registered
      # Irish bank — see README, "Честные ограничения".
      BANK_CODE: "ZZZZ"
      # Left at their code defaults (10 attempts / 5 minutes) — present
      # here only so the rate limit is visible/tunable without a code
      # change, same reasoning as RECONCILE_STALE_AFTER below.
      IBAN_RESOLVE_RATE_LIMIT: "10"
      IBAN_RESOLVE_RATE_WINDOW: "5m"
    depends_on:
      pg-haproxy:
        condition: service_healthy
      ledger-svc:
        condition: service_started
      kafka:
        condition: service_started

  ledger-svc:
    build:
      context: .
      dockerfile: services/ledger-svc/Dockerfile
    ports:
      - "8083:8083"
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://neobank:neobank_dev_password@pg-haproxy:5432/neobank?sslmode=disable
    depends_on:
      pg-haproxy:
        condition: service_healthy

  transfers-svc:
    build:
      context: .
      dockerfile: services/transfers-svc/Dockerfile
    ports:
      - "8084:8084"
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://neobank:neobank_dev_password@pg-haproxy:5432/neobank?sslmode=disable
      # Same role/password — a standby is a physical copy of the leader,
      # cluster-wide catalog data (roles included) and all, so `neobank`
      # already exists there with no separate provisioning. See README's
      # read/write split rule for which queries this is actually allowed
      # to serve (short version: not balance, not anything read right
      # after a write).
      #
      # Port 5433 on pg-haproxy is "whichever nodes are standbys right
      # now", not a named container: after a failover the node that used
      # to serve these reads is the leader and a different node (or the
      # returned old leader) serves them instead. Pointing at a hostname
      # here — which is what this line used to do — would mean reads
      # follow a container rather than a role.
      DATABASE_URL_REPLICA: postgres://neobank:neobank_dev_password@pg-haproxy:5433/neobank?sslmode=disable
      ACCOUNTS_GRPC_ADDR: accounts-svc:9082
      FRAUD_GRPC_ADDR: fraud-svc:9085
      LEDGER_GRPC_ADDR: ledger-svc:8083
      KAFKA_BROKERS: kafka:9092
      KAFKA_TRANSFER_EVENTS_TOPIC: transfer.events
      # Left empty by default, in which case the service uses its own
      # 2-minute default. Overridable from .env purely so the
      # reconciliation trace can be demonstrated without waiting two
      # minutes per attempt — see README, "Reconciliation в трейсе".
      RECONCILE_STALE_AFTER: ${RECONCILE_STALE_AFTER:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    depends_on:
      pg-haproxy:
        condition: service_healthy
      accounts-svc:
        condition: service_started
      fraud-svc:
        condition: service_started
      ledger-svc:
        condition: service_started
      kafka:
        condition: service_started

  fraud-svc:
    build:
      context: .
      dockerfile: services/fraud-svc/Dockerfile
    ports:
      - "8085:8085"
      - "9085:9085"
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://neobank:neobank_dev_password@pg-haproxy:5432/neobank?sslmode=disable
      GRPC_PORT: "9085"
    depends_on:
      pg-haproxy:
        condition: service_healthy

  notifications-svc:
    build:
      context: .
      dockerfile: services/notifications-svc/Dockerfile
    ports:
      - "8086:8086"
    # main() drains the in-flight message on SIGTERM before exiting — see
    # services/notifications-svc/main.go and README's "notifications-svc:
    # устойчивость консьюмера" — and that drain is deliberately not
    # bounded by a timeout of its own. Docker's default 10s grace period
    # before SIGKILL is shorter than transfer.events' worst case (up to
    # transferMaxAttempts retries of a fully-down SMTP dependency, plus
    # backoff between them), so a plain `docker compose stop` could still
    # SIGKILL mid-retry. That is not data loss — the message just stays
    # uncommitted and 'processing', and claimEvent reclaims it on the next
    # start, the same recovery path a hard crash already relies on — but
    # a generous grace period here is what lets a routine restart finish
    # gracefully instead of falling back to that path every time.
    stop_grace_period: 60s
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://neobank:neobank_dev_password@pg-haproxy:5432/neobank?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_USER_EVENTS_TOPIC: user.events
      KAFKA_ACCOUNT_EVENTS_TOPIC: account.events
      KAFKA_TRANSFER_EVENTS_TOPIC: transfer.events
      KAFKA_TRANSFER_DLQ_TOPIC: transfer.events.dlq
      # Byte-identical to auth-svc's, so both services deliver into the
      # same Mailpit inbox from the same sender. Switching to a real
      # provider is a change to these two values plus SMTP credentials,
      # not to any sending logic.
      SMTP_ADDR: mailpit:1025
      SMTP_FROM: noreply@neobank.local
    depends_on:
      pg-haproxy:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy

  # etcd — the DCS (Distributed Configuration Store). This is where the
  # three Patroni nodes keep the leader key, the sync-standby key and the
  # cluster config, and it is the reason they can agree on a single
  # leader instead of each deciding for itself.
  #
  # Without a DCS with real consensus, automatic failover is a split-brain
  # generator: a node that loses contact with the leader cannot tell "the
  # leader is dead" from "I am the one who is partitioned", and if it
  # promotes itself on that guess you get two nodes accepting writes.
  # Two histories that both look valid, diverging entry by entry — for a
  # double-entry ledger that is unrecoverable by anything short of a human
  # reading both WALs. etcd removes the guess: promotion requires taking a
  # key that only one node can hold, and a partitioned minority cannot
  # take it because it cannot reach a quorum.
  #
  # ONE NODE IS A DEV-ONLY SHORTCUT. A single-node etcd has no quorum to
  # lose, so it is itself a single point of failure — exactly the thing
  # this sprint set out to remove, moved one layer down. If it dies the
  # cluster does not split-brain (Patroni demotes the leader when it
  # cannot reach the DCS, which is the safe direction) but it does stop
  # accepting writes until etcd is back. Production needs 3 or 5 etcd
  # nodes on separate failure domains. See README.
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    environment:
      ETCD_NAME: etcd0
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: etcd0=http://etcd:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: neobank-etcd
      # Patroni's etcd3 client uses the gRPC v3 API; this only affects
      # etcdctl, which the healthcheck below shells out to.
      ETCDCTL_API: "3"
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The three Postgres nodes. They are deliberately identical — no
  # "primary" service and no "replica" services, because after the first
  # failover those names would be lies. Which node is leader, which is
  # the synchronous standby and which is asynchronous is Patroni's
  # decision, held in etcd, and it changes at runtime.
  #
  # Everything that differs between the three is the three PATRONI_* env
  # vars below; the config they share is infra/patroni/patroni.yml, baked
  # into the image. Same "one script, env-driven differences" shape the
  # replica-entrypoint.sh they replace had.
  #
  # No host port mappings on the nodes themselves: reaching a specific
  # node by a fixed address is precisely the habit this sprint removes.
  # Everything goes through pg-haproxy. (`docker compose exec pg-node1
  # psql ...` still works for inspection, and the README uses it.)
  pg-node1: &pg-node
    build:
      context: .
      dockerfile: infra/patroni/Dockerfile
    environment: &pg-node-env
      PATRONI_NAME: pg-node1
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-node1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-node1:5432
    volumes:
      - pg_node1_data:/var/lib/postgresql/data
    depends_on:
      etcd:
        condition: service_healthy
    # Asks Patroni, not Postgres: /health is 200 whenever this node's
    # postgres is running in whatever role Patroni intends for it. A node
    # that is up but which Patroni has fenced is not healthy.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8008/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  pg-node2:
    <<: *pg-node
    environment:
      <<: *pg-node-env
      PATRONI_NAME: pg-node2
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-node2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-node2:5432
    volumes:
      - pg_node2_data:/var/lib/postgresql/data

  pg-node3:
    <<: *pg-node
    environment:
      <<: *pg-node-env
      PATRONI_NAME: pg-node3
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-node3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-node3:5432
    volumes:
      - pg_node3_data:/var/lib/postgresql/data

  # The application's entry point to the cluster, and the answer to "the
  # leader's address changes after a failover, so what do services
  # connect to?". Full routing rationale — including why the health
  # checks target Patroni's REST API rather than Postgres itself — is in
  # infra/haproxy/haproxy.cfg. The choice of HAProxy over the
  # target_session_attrs=read-write alternative is argued in the README.
  #
  #   5432 — the current leader (writes + read-your-writes reads)
  #   5433 — any current standby (DATABASE_URL_REPLICA)
  #   5434 — the current synchronous standby (inspection/tests only)
  #   7000 — stats, and the source of this container's own healthcheck
  #
  # Host ports are unchanged from the pre-Patroni topology on purpose:
  # every `psql -h localhost -p 5432`, every DATABASE_URL in the README's
  # test invocations, and cmd/seed and cmd/devtopup all keep working
  # without edits — they now just reach whoever is leader instead of a
  # fixed container.
  pg-haproxy:
    image: haproxy:3.0-alpine
    volumes:
      - ./infra/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5432:5432"
      - "5433:5433"
      - "5434:5434"
      - "7000:7000"
    depends_on:
      pg-node1:
        condition: service_started
      pg-node2:
        condition: service_started
      pg-node3:
        condition: service_started
    # "A leader exists and is routable", not "haproxy started" — which is
    # what every service's `depends_on: pg-haproxy: service_healthy`
    # actually needs, since they all run migrations against the leader
    # and log.Fatalf if that fails. Reads HAProxy's own stats CSV and
    # requires at least one server in the `primary` backend to be UP
    # (field 18 is status).
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - 'http://127.0.0.1:7000/;csv'
          | awk -F, '$$1=="primary" && $$2 ~ /^pg-node/ && $$18=="UP" { found=1 } END { exit !found }'
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 40s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnamilegacy/kafka:3.7.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/bitnami/kafka

  # One-shot provisioning of every topic notifications-svc reads, with an
  # explicit retention policy for each (idempotent — --if-not-exists on
  # create, and --alter --add-config is safe to reapply).
  #
  # user.events/account.events get cleanup.policy=compact so a
  # late-subscribing consumer group can always read every historical
  # event for a still-live key, not just whatever survived time-based
  # retention. See README's "Kafka: offset reset и retention" section.
  #
  # transfer.events gets cleanup.policy=delete — the broker default,
  # stated explicitly because the alternative is actively wrong here. Its
  # key is sender_account_id, so a compacted transfer.events would retain
  # only the LAST event per sender and silently discard the rest of their
  # transfer history: it's a log of discrete facts, not a snapshot of
  # state, and compaction on it would be data loss wearing a retention
  # policy's clothes. It is created here rather than left to broker
  # auto-creation so notifications-svc's depends_on actually covers all
  # three of the topics it reads — otherwise, on a stack where nobody has
  # transferred yet, its reader spins against a topic that doesn't exist.
  #
  # transfer.events.dlq holds messages notifications-svc gave up on after
  # transferMaxAttempts (see services/notifications-svc/kafka.go) —
  # poison payloads, permanently-refused addresses, anything that failed
  # the same way every retry. delete, not compact, for the same reason as
  # transfer.events itself: each DLQ entry is a distinct failure worth
  # keeping, not a snapshot to collapse by key.
  kafka-init:
    image: bitnamilegacy/kafka:3.7.1
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        until kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do sleep 2; done
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic user.events --config cleanup.policy=compact
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic account.events --config cleanup.policy=compact
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic transfer.events --config cleanup.policy=delete
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic transfer.events.dlq --config cleanup.policy=delete
        kafka-configs.sh --bootstrap-server kafka:9092 --alter --topic user.events --add-config cleanup.policy=compact
        kafka-configs.sh --bootstrap-server kafka:9092 --alter --topic account.events --add-config cleanup.policy=compact
        kafka-configs.sh --bootstrap-server kafka:9092 --alter --topic transfer.events --add-config cleanup.policy=delete
        kafka-configs.sh --bootstrap-server kafka:9092 --alter --topic transfer.events.dlq --add-config cleanup.policy=delete

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # S3-compatible object storage for avatar uploads. Provisioned this
  # sprint (bucket only — nothing uploads into it yet, that's next); see
  # README's "Честные ограничения" for the prod-swap story: R2/S3 speak
  # the same API, so going to production is an endpoint/credential change
  # here and in whichever service ends up with an S3 client, not a
  # rewrite. Dev credentials are the same "publicly a file in this repo
  # the moment it's committed, so hiding them is pointless" reasoning as
  # Postgres's — see that bullet in README.
  #
  # No healthcheck block: MinIO's image ships no shell utility (curl/wget)
  # a HEALTHCHECK could use — the same situation kafka is in below, and
  # solved the same way: minio-init retry-loops until the API actually
  # answers, rather than the compose file asserting a liveness check that
  # doesn't have a command to run.
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: neobank
      MINIO_ROOT_PASSWORD: neobank_dev_password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # One-shot: waits for MinIO's API to come up, then creates the avatars
  # bucket if it doesn't already exist (--ignore-existing is idempotent,
  # same convention as kafka-init's --if-not-exists below). mc is MinIO's
  # own client and the image that ships it and nothing else, mirroring
  # kafka-init's shape exactly.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    environment:
      MINIO_ROOT_USER: neobank
      MINIO_ROOT_PASSWORD: neobank_dev_password
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do sleep 2; done
        mc mb --ignore-existing local/avatars

  # Distributed tracing backend. all-in-one bundles the collector, the
  # storage and the UI in one container with an in-memory store — which
  # is the right shape for local development and explicitly not for
  # anything else: every trace is lost on restart, and memory grows with
  # traffic until it is.
  #
  # No service `depends_on` this. Tracing is diagnostics, and a
  # diagnostics backend that can stop the bank from starting is worse than
  # no diagnostics: the OTLP exporter connects lazily and retries, so a
  # Jaeger that is down or absent costs nothing but the traces themselves
  # (see pkg/tracing.Init).
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      # OTLP receivers are on by default in recent versions; set
      # explicitly so the contract is visible here rather than inherited
      # from an image default that has changed before.
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      # 16686 — the UI. This is the one to open.
      - "16686:16686"
      # 4317 OTLP/gRPC, 4318 OTLP/HTTP. Services use gRPC (4317); 4318 is
      # published only so a curl or a browser-side exporter can reach it
      # during debugging.
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:14269/ | grep -q '\"status\":\"Server available\"'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # One volume per Patroni node. They are NOT interchangeable and must not
  # be pre-seeded from each other: Patroni bootstraps the first node with
  # initdb and clones the other two from it via pg_basebackup, so an
  # already-populated volume on a node that was meant to clone makes it
  # try to rejoin a cluster it was never part of. `docker compose down -v`
  # is the reset button.
  pg_node1_data:
  pg_node2_data:
  pg_node3_data:
  etcd_data:
  kafka_data:
  minio_data:
