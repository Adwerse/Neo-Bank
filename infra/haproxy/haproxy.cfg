# The stable address the application connects to. After a failover the
# leader is a different container with a different hostname; nothing in
# the six services knows or cares, because they all point here.
#
# Every backend below asks the same question in the same way: not "is
# this Postgres up?" and not "does this Postgres say it is writable?",
# but "does Patroni, which owns the leader key in etcd, consider this
# node to hold role X right now?". That distinction is the reason this
# file health-checks port 8008 (Patroni's REST API) while proxying port
# 5432. A demoted-but-still-running Postgres answers TCP connects
# happily; only Patroni knows it is no longer the leader.

global
    maxconn 300
    # Log to stdout so `docker compose logs pg-haproxy` shows check
    # transitions — which is how you watch a failover happen from the
    # routing layer's point of view.
    log stdout format raw local0 info

# Runtime DNS, and this is not optional in a compose setup.
#
# By default HAProxy resolves every `server` hostname ONCE, at startup,
# and caches the address forever. Docker hands a container a new IP every
# time it is recreated — which happens on `docker compose up` after an
# image change, and can happen when a stopped container is started again.
# The result is a proxy that is up, healthy-looking, and connecting to
# addresses where nothing lives: every backend shows L4CON and the whole
# cluster appears down while all three nodes are in fact fine.
#
# That was observed here, not anticipated: after rebuilding the Patroni
# image, all six backends went DOWN with L4CON while `docker inspect`
# showed the nodes running happily on new IPs. It matters beyond the
# rebuild case — the failover exercise ends by bringing the killed node
# back, and a proxy that cannot re-resolve would never route to it again.
#
# 127.0.0.11 is Docker's embedded DNS server, present in every container
# on a user-defined network. The short hold times keep a recreated
# container's new address from being cached past the next health check.
resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold other 5s
    hold refused 5s
    hold nx 5s
    hold timeout 5s

defaults
    mode tcp
    log global
    option tcplog
    retries 2
    timeout connect 3s
    timeout client 30m
    timeout server 30m
    timeout check 3s
    # Long client/server timeouts because these are database
    # connections held open by pgxpool for up to MaxConnLifetime, not
    # short HTTP requests. A 1m timeout here would silently sever idle
    # pooled connections and manufacture exactly the "dead pool"
    # symptom this whole sprint is about.

# Stats, and also the container's own healthcheck surface: compose asks
# this CSV whether the `primary` backend currently has an UP server, so
# `depends_on: service_healthy` means "a leader exists and is routable",
# not merely "haproxy started".
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s

# Port 5432 — the leader, and only the leader.
#
# There is no `balance` directive on purpose: Patroni's /primary returns
# 200 on exactly one node, so at most one server is ever UP here and
# HAProxy's default round-robin degenerates to "send everything to the
# one that answers". Adding a balance algorithm would suggest a choice
# is being made; there is never more than one candidate.
listen primary
    bind *:5432
    option httpchk GET /primary
    http-check expect status 200
    # inter 1s / fall 2 → a demoted or dead node leaves rotation ~2s
    # after Patroni stops calling it the leader. Much faster than
    # Patroni's own 20s TTL, so eviction is never the bottleneck.
    #
    # rise 1 — asymmetric on purpose, and it is worth being explicit
    # about why, because "require two consecutive successes" is the
    # sensible default almost everywhere else. The usual reason for
    # rise > 1 is that a single successful probe is weak evidence: a
    # server can answer one request and still be unwell. Here the probe
    # is not a sample of health, it is a lookup — Patroni answers 200 on
    # /primary if and only if it currently holds the leader key in etcd,
    # and it holds that key alone. A second confirmation adds no
    # information and costs a full `inter` of downtime on every failover;
    # measured, it was ~3s of the 25s window. fall stays at 2, because
    # the asymmetry runs the other way there: a single missed check
    # really can be a blip, and evicting the leader on one is the
    # expensive mistake.
    #
    # on-marked-down shutdown-sessions is the single most important
    # option in this file for application behaviour. Without it, the TCP
    # connections a pgxpool already holds to the old leader stay
    # ESTABLISHED through HAProxy after that node fails its check — the
    # pool keeps handing out connections to a node that is gone or
    # demoted, and each one fails only when it is next used, or hangs
    # until an OS-level TCP timeout. With it, HAProxy actively tears
    # those sessions down the moment the node is marked down, which
    # surfaces as an immediate connection error on the client side —
    # and pgx destroys a connection that errored at the protocol level
    # rather than returning it to the pool, so the pool refills against
    # whoever is leader now. "Reconnects instead of staying dead" is
    # bought here, not in the Go code.
    default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
    server pg-node1 pg-node1:5432 maxconn 100 check port 8008 resolvers docker init-addr last,libc,none
    server pg-node2 pg-node2:5432 maxconn 100 check port 8008 resolvers docker init-addr last,libc,none
    server pg-node3 pg-node3:5432 maxconn 100 check port 8008 resolvers docker init-addr last,libc,none

# Port 5433 — any healthy standby, round-robin. This is what
# DATABASE_URL_REPLICA points at, and it replaces the previous hardcoded
# `postgres-replica-async` hostname: that name described a role a
# specific container held permanently, which is precisely the assumption
# failover breaks.
#
# Patroni's /replica returns 200 only for a node that is running, in
# recovery, and not tagged noloadbalance — so the current leader drops
# out of this pool automatically the moment it is promoted, and a node
# that is still catching up after a rejoin does not receive reads.
listen replicas
    bind *:5433
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg-node1 pg-node1:5432 maxconn 100 check port 8008 resolvers docker init-addr last,libc,none
    server pg-node2 pg-node2:5432 maxconn 100 check port 8008 resolvers docker init-addr last,libc,none
    server pg-node3 pg-node3:5432 maxconn 100 check port 8008 resolvers docker init-addr last,libc,none

# Port 5434 — the synchronous standby specifically, whichever node
# currently holds that role (Patroni's /sync reads the /sync key in
# etcd, the same key it refuses to promote outside of).
#
# No service points here. It exists because the sprint-1 topology had a
# named, addressable synchronous replica and losing the ability to
# inspect it would be a regression: this is the address the failover
# test and the manual verification in the README use to prove that a
# transaction acknowledged by the leader is physically present on a
# second node BEFORE anything is killed.
listen sync-standby
    bind *:5434
    option httpchk GET /sync
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg-node1 pg-node1:5432 maxconn 100 check port 8008 resolvers docker init-addr last,libc,none
    server pg-node2 pg-node2:5432 maxconn 100 check port 8008 resolvers docker init-addr last,libc,none
    server pg-node3 pg-node3:5432 maxconn 100 check port 8008 resolvers docker init-addr last,libc,none
