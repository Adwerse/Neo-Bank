syntax = "proto3";

package accounts.v1;

option go_package = "neobank/proto/gen/go/accounts/v1;accountsv1";

// AccountsService is accounts-svc's internal service-to-service contract.
// Not exposed through the gateway — the intended caller is transfers-svc,
// which needs to resolve a human-entered IBAN to an internal account_id,
// and check either party's account status, without touching accounts-svc's
// Postgres database directly.
service AccountsService {
  // ResolveAccountByIban looks up an account by its IBAN (as shown to and
  // entered by users), returning its internal account_id and current
  // status. Distinguishes three failure kinds via gRPC status code, each
  // meaning something different to the caller: codes.InvalidArgument (the
  // IBAN's own format/check-digits don't check out — rejected locally,
  // before ever touching the database), codes.FailedPrecondition (a
  // structurally valid IBAN, but for a bank code that isn't this one — this
  // system has no SEPA/inter-bank rail), and codes.NotFound (this bank's
  // IBAN, but no account behind it). codes.ResourceExhausted means the
  // calling user (identified by the required user_id field) has made too
  // many resolve attempts recently — see ResolveAccountByIbanRequest.
  rpc ResolveAccountByIban(ResolveAccountByIbanRequest) returns (ResolveAccountByIbanResponse);
  // GetAccountByID looks up an account by its internal account_id — used to
  // check the sender's own account status.
  rpc GetAccountByID(GetAccountByIDRequest) returns (GetAccountByIDResponse);
  // GetAccountByUserID looks up an account by the owning user's id — used by
  // transfers-svc to resolve the authenticated caller's sender account_id
  // from the gateway-injected X-User-Id header.
  rpc GetAccountByUserID(GetAccountByUserIDRequest) returns (GetAccountByUserIDResponse);
  // ResolveAccountsByIds looks up multiple accounts by internal account_id
  // in a single call — used by transfers-svc to resolve every counterparty
  // account_number for a page of transfer history in one round trip instead
  // of one call per counterparty. An id with no matching account is simply
  // omitted from the response, not treated as an error: a miss here would
  // indicate a data inconsistency (a transfer referencing a nonexistent
  // account), not a caller mistake, and returning what IS resolvable is more
  // useful than failing the whole page over it.
  rpc ResolveAccountsByIds(ResolveAccountsByIdsRequest) returns (ResolveAccountsByIdsResponse);
}

message ResolveAccountByIbanRequest {
  string iban = 1;
  // user_id is the caller's own authenticated user id (transfers-svc's
  // gateway-injected X-User-Id, passed through explicitly since gRPC
  // metadata doesn't carry it automatically) — required so accounts-svc can
  // key its per-user resolve rate limit on the actual caller, not the IBAN
  // being probed.
  string user_id = 2;
}

message ResolveAccountByIbanResponse {
  string account_id = 1;
  string status = 2;
}

message GetAccountByIDRequest {
  string account_id = 1;
}

message GetAccountByIDResponse {
  string account_id = 1;
  string status = 2;
  string account_number = 3;
}

message GetAccountByUserIDRequest {
  string user_id = 1;
}

message GetAccountByUserIDResponse {
  string account_id = 1;
  string status = 2;
}

message ResolveAccountsByIdsRequest {
  repeated string account_ids = 1;
}

message ResolveAccountsByIdsResponse {
  repeated AccountSummary accounts = 1;
}

// AccountSummary is a minimal per-account projection for batch lookups —
// only what a caller needs to enrich a list of records with human-readable
// account info, not the full GetAccountByIDResponse shape. Carries iban
// rather than account_number: transfers-svc uses this to label transfer
// counterparties, and IBAN is this system's one user-facing account
// identifier (see README) — the same one a sender types in to reach this
// account in the first place.
message AccountSummary {
  string account_id = 1;
  string iban = 2;
}
