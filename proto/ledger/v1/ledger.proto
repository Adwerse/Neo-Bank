syntax = "proto3";

package ledger.v1;

import "google/protobuf/timestamp.proto";

option go_package = "neobank/proto/gen/go/ledger/v1;ledgerv1";

// LedgerService is ledger-svc's internal service-to-service contract.
// Not exposed through the gateway — the only intended caller is
// transfers-svc, which speaks to ledger-svc directly inside the cluster.
service LedgerService {
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  rpc ExecuteTransfer(ExecuteTransferRequest) returns (ExecuteTransferResponse);
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);
  // CreateLedgerAccount is idempotent: if a ledger account already exists
  // for account_id (account_id is UNIQUE), it returns the existing one
  // rather than erroring. Its intended caller is accounts-svc, which calls
  // it once per new account created off a UserActivated Kafka event — an
  // at-least-once, redelivery-prone path, hence the idempotency requirement.
  rpc CreateLedgerAccount(CreateLedgerAccountRequest) returns (CreateLedgerAccountResponse);
  // GetTransactionByReference answers "did I ever execute a transfer
  // tagged with this reference" — found=false is a normal, expected
  // answer (not an error), same as ExecuteTransferRequest.reference being
  // optional. Exists for callers (transfers-svc) that lost track of
  // whether an ExecuteTransfer call actually committed (e.g. the response
  // was never received) and need ledger-svc's own data, not a guess, to
  // find out.
  rpc GetTransactionByReference(GetTransactionByReferenceRequest) returns (GetTransactionByReferenceResponse);
  // Deposit posts a genesis -> account_id credit: the ledger-side
  // counterpart of an external, Stripe-funded top-up. Unlike
  // ExecuteTransfer, there is no insufficient-funds outcome — genesis is
  // allowed to go arbitrarily negative by design, representing money
  // entering the system from outside. Idempotent on reference: a repeat
  // call with a reference that already has an entry returns that entry's
  // transaction_id instead of posting a second one — unlike
  // ExecuteTransfer, which is not idempotent, because Deposit's callers
  // (transfers-svc's crediting worker, in particular) can genuinely be
  // invoked more than once for the same logical deposit with no
  // idempotency-key layer of their own above this call to catch it.
  rpc Deposit(DepositRequest) returns (DepositResponse);
  // ReverseDeposit posts the opposite of Deposit: account_id -> genesis,
  // for compensating a deposit that was credited and then refunded in
  // Stripe. Also has no insufficient-funds outcome, deliberately — the
  // refund already happened in Stripe regardless of what account_id
  // currently holds in-ledger, so the books must reflect it even if that
  // leaves account_id negative (a known MVP limitation, see README). Same
  // idempotency-on-reference contract as Deposit.
  rpc ReverseDeposit(DepositRequest) returns (DepositResponse);
  // GetBalanceHistory returns a day-aggregated balance series, already
  // summed server-side — callers must never pull the full entries log to
  // build a chart client-side. from unset means the account's entire
  // history.
  rpc GetBalanceHistory(GetBalanceHistoryRequest) returns (GetBalanceHistoryResponse);
}

message GetBalanceRequest {
  string account_id = 1;
}

message GetBalanceResponse {
  int64 balance = 1;
}

message ExecuteTransferRequest {
  string from_account_id = 1;
  string to_account_id = 2;
  int64 amount = 3;
  // Optional caller-supplied correlation id (e.g. transfers-svc's own
  // transfer id), stored on both entries this call writes. Lets a caller
  // that lost track of an ExecuteTransfer response later ask
  // GetTransactionByReference whether it actually committed. Left empty,
  // this call behaves exactly as before — ledger-svc has no opinion on
  // what a reference means, it just stores and looks it up.
  string reference = 4;
}

message ExecuteTransferResponse {
  string transaction_id = 1;
}

message GetTransactionByReferenceRequest {
  string reference = 1;
}

message GetTransactionByReferenceResponse {
  bool found = 1;
  // Only meaningful when found is true.
  string transaction_id = 2;
}

message GetHistoryRequest {
  string account_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetHistoryResponse {
  repeated Entry entries = 1;
}

// Entry is one row of an account's entries log, newest first.
message Entry {
  string transaction_id = 1;
  int64 amount = 2;
  google.protobuf.Timestamp created_at = 3;
}

message CreateLedgerAccountRequest {
  string account_id = 1;
}

message CreateLedgerAccountResponse {
  string account_id = 1;
  google.protobuf.Timestamp created_at = 2;
}

// DepositRequest is shared by Deposit and ReverseDeposit — account_id is
// the account credited by Deposit, or debited by ReverseDeposit.
message DepositRequest {
  string account_id = 1;
  int64 amount = 2;
  // Unlike ExecuteTransferRequest.reference (an optional correlation id),
  // this is also the idempotency key: see Deposit/ReverseDeposit's doc
  // comments. Intended to carry the transfers-svc deposits.id (Deposit)
  // or a value deterministically derived from it (ReverseDeposit, so a
  // reversal doesn't collide with its own deposit's original credit
  // reference).
  string reference = 3;
}

message DepositResponse {
  string transaction_id = 1;
}

message GetBalanceHistoryRequest {
  string account_id = 1;
  // Inclusive lower bound. Unset means "from the beginning of the
  // account's history" — ledger-svc has no concept of week/month/all,
  // that translation happens in the caller (accounts-svc).
  google.protobuf.Timestamp from = 2;
}

message GetBalanceHistoryResponse {
  repeated BalancePoint points = 1;
}

// BalancePoint is one day's closing balance, oldest first. Days with no
// entries are gaps here, not filled with a repeated value.
message BalancePoint {
  google.protobuf.Timestamp date = 1;
  int64 balance = 2;
}
